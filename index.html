<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expense Tracker</title>
  <meta name="description" content="Personal income and expense tracker">
  <meta name="theme-color" content="#F97316">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-card" autocomplete="on">
      <img src="icons/icon-192.png" alt="" class="login-logo">
      <h1>Expense Tracker</h1>
      <div class="seg two" style="margin-top:16px">
        <button type="button" id="modeLogin" class="on">Login</button>
        <button type="button" id="modeSignup">Sign up</button>
      </div>
      <label class="field signup-only hidden">
        <span>Your name</span>
        <input id="loginName" maxlength="40" placeholder="e.g. Bhumit" autocomplete="name">
      </label>
      <label class="field">
        <span>Mobile number</span>
        <input id="loginMobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit mobile" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <div class="pw-wrap">
          <input id="loginPass" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" required>
          <button type="button" id="pwToggle" class="pw-toggle" aria-label="Show password">Show</button>
        </div>
      </label>
      <label class="field signup-only hidden">
        <span>Invite code</span>
        <input id="loginInvite" autocomplete="off" autocapitalize="characters" placeholder="Ask the app owner">
      </label>
      <p id="loginError" class="error" role="alert"></p>
      <button id="loginBtn" class="btn primary block" type="submit">Login</button>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand"><img src="icons/icon-192.png" alt=""><span id="pageTitle">Dashboard</span></div>
      <button id="syncBadge" class="sync" data-action="syncNow" type="button"></button>
    </header>
    <main id="view"></main>
    <button id="fab" class="fab" data-action="add" type="button" aria-label="Add entry">
      <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </button>
    <nav class="tabbar">
      <button data-tab="dashboard" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Dashboard</span>
      </button>
      <button data-tab="income" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Income</span>
      </button>
      <button data-tab="expense" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Expense</span>
      </button>
      <button data-tab="settings" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Bottom sheet -->
  <div id="sheetWrap" class="sheet-wrap hidden">
    <div class="sheet-backdrop" data-action="closeSheet"></div>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
